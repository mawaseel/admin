<style>
:root{--brand:#748064;--bg:#f4f3ed;--card:#fff;--ink:#0b0b0c;--muted:#6a6a6a;--line:rgba(10,10,10,.11)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px}.wrap{width:min(100%,980px);display:grid;grid-template-columns:1fr 1fr;min-height:620px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.08)}.visual{background:#0b0b0c;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.visual:after{content:'ADMIN';position:absolute;left:-30px;bottom:-40px;font-weight:900;font-size:9rem;opacity:.055}.visual img{height:42px;width:max-content;filter:invert(1)}.visual h2{font-size:clamp(2.3rem,5vw,4.7rem);line-height:1.05;margin:0;position:relative;z-index:1}.visual h2 span{color:var(--brand)}.form{padding:48px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:.78rem;font-weight:900;color:var(--brand);letter-spacing:.08em}h1{font-size:2.5rem;margin:8px 0 8px}p{color:var(--muted);margin:0 0 28px;line-height:1.8}.social-login{display:grid;gap:12px}.social-btn{width:100%;height:54px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:.25s}.social-btn:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 10px 24px rgba(0,0,0,.06)}.social-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}.google-icon{width:20px;height:20px}.facebook-icon{color:#1877F2;font-size:1.3rem}.msg{min-height:24px;margin-top:16px;font-weight:700;font-size:.9rem;color:#b91c1c}.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(116,128,100,.08);font-size:.78rem;color:var(--muted);line-height:1.7}.back{display:inline-flex;gap:8px;align-items:center;margin-top:18px;font-weight:800;color:var(--muted);text-decoration:none}@media(max-width:760px){.wrap{grid-template-columns:1fr;min-height:auto}.visual{display:none}.form{padding:34px 24px}}</style>

</head><body>
<main class="wrap"><section class="visual"><a href="https://mawaseel.com"><img alt="مواصيل" src="https://i.ibb.co/DPSRG0Z0/image.png" data-mawaseel-logo="1" data-logo-force="dark"/></a><h2>إدارة الطلبات.<br/><span>للفريق فقط.</span></h2><small>MAWASEEL ADMIN PORTAL</small></section><section class="form"><div class="eyebrow">بوابة الإدارة</div><h1>فوت ع حسابك.</h1><p>استخدم حساب جوجل أو فيسبوك المصرّح له ضمن فريق إدارة مواصيل.</p><div class="social-login"><button aria-label="تسجيل الدخول عبر جوجل" class="social-btn" id="google-btn" type="button"><svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg><span>كمّل مع جوجل</span></button><button aria-label="تسجيل الدخول عبر فيسبوك" class="social-btn" id="facebook-btn" type="button"><i class="fa-brands fa-facebook facebook-icon"></i><span>كمّل مع فيسبوك</span></button></div><div class="msg" id="msg"></div><div class="note">الدخول بحد ذاته ما بعطي صلاحية إدارة؛ الـBackend بفحص الحساب والصلاحيات قبل فتح اللوحة.</div><a class="back" href="https://mawaseel.com"><i class="fa-solid fa-arrow-right"></i> ارجع للموقع</a></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import {getAuth,setPersistence,browserLocalPersistence,GoogleAuthProvider,FacebookAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyBC4KevTkZ_myJZ5kG7LXqAALUVSdLsnHE',authDomain:'mawaseel.firebaseapp.com',projectId:'mawaseel',storageBucket:'mawaseel.firebasestorage.app',messagingSenderId:'877553024815',appId:'1:877553024815:web:bdd1a3c4b352e915e06bda',measurementId:'G-7X5GBYVJ9M'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),API_BASE='https://mawaseel-backend.onrender.com',msg=document.getElementById('msg');
const googleProvider=new GoogleAuthProvider(),facebookProvider=new FacebookAuthProvider();googleProvider.setCustomParameters({prompt:'select_account'});facebookProvider.addScope('email');
function cookie(role){document.cookie=`mawaseel_portal=${role}; Domain=.mawaseel.com; Path=/; Max-Age=2592000; SameSite=Lax; Secure`;}
async function apiCheck(user){const token=await user.getIdToken(true);const res=await fetch(API_BASE+'/api/me',{headers:{Authorization:`Bearer ${token}`}});const d=await res.json().catch(()=>({}));if(!res.ok){const e=new Error(d.error||'api_error');e.status=res.status;e.code=d.error;throw e}return d}
async function route(user){try{await apiCheck(user);cookie('admin');location.replace('./');return true}catch(e){await signOut(auth);msg.textContent=e.code==='admin_required'?'هذا الحساب مش مضاف ضمن فريق الإدارة.':e.code==='admin_email_required'?'لازم يكون حساب فيسبوك مربوط بإيميل حتى ندخلك كأدمن.':'تعذر التحقق من حساب الإدارة.';return false}}
function authMessage(e){if(e?.code==='auth/popup-closed-by-user')return 'سكرت نافذة تسجيل الدخول قبل ما تكمّل.';if(e?.code==='auth/popup-blocked')return 'المتصفح منع نافذة تسجيل الدخول.';if(e?.code==='auth/account-exists-with-different-credential')return 'هذا الإيميل مربوط بطريقة دخول ثانية. جرّب الطريقة المرتبطة بالحساب.';if(e?.code==='auth/operation-not-allowed')return 'طريقة تسجيل الدخول هاي مش مفعّلة من Firebase.';if(e?.code==='auth/network-request-failed')return 'تعذر الاتصال. جرّب مرة ثانية.';return 'صار خطأ أثناء تسجيل الدخول.'}
async function socialLogin(provider,btn){msg.textContent='';const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جاري الدخول';try{const r=await signInWithPopup(auth,provider);await route(r.user)}catch(e){console.error(e);msg.textContent=authMessage(e)}finally{btn.disabled=false;btn.innerHTML=old}}
await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,u=>{if(u)route(u).catch(()=>{})});document.getElementById('google-btn').onclick=()=>socialLogin(googleProvider,document.getElementById('google-btn'));document.getElementById('facebook-btn').onclick=()=>socialLogin(facebookProvider,document.getElementById('facebook-btn'));
</script></body></html>
