<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>مواصيل | دخول الإدارة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
:root{--brand:#ff4500;--bg:#f4f3ed;--card:#fff;--ink:#0b0b0c;--muted:#6a6a6a;--line:rgba(10,10,10,.11)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px}.wrap{width:min(100%,980px);display:grid;grid-template-columns:1fr 1fr;min-height:620px;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.08)}.visual{background:#0b0b0c;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.visual:after{content:'ADMIN';position:absolute;left:-30px;bottom:-40px;font-weight:900;font-size:9rem;opacity:.055}.visual img{height:42px;width:max-content;filter:invert(1)}.visual h2{font-size:clamp(2.3rem,5vw,4.7rem);line-height:1.05;margin:0;position:relative;z-index:1}.visual h2 span{color:var(--brand)}.form{padding:48px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:.78rem;font-weight:900;color:var(--brand);letter-spacing:.08em}h1{font-size:2.5rem;margin:8px 0 8px}p{color:var(--muted);margin:0 0 32px}label{display:block;font-weight:800;font-size:.9rem;margin:18px 0 8px}input{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:14px;font:inherit;background:#fff;outline:none}input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,69,0,.12)}button{width:100%;border:0;border-radius:999px;padding:16px;margin-top:26px;background:#0b0b0c;color:#fff;font:inherit;font-weight:900;cursor:pointer}button:hover{background:var(--brand)}.msg{min-height:24px;margin-top:16px;font-weight:700;font-size:.9rem;color:#b91c1c}.back{display:inline-flex;gap:8px;align-items:center;margin-top:18px;font-weight:800;color:var(--muted);text-decoration:none}@media(max-width:760px){.wrap{grid-template-columns:1fr;min-height:auto}.visual{display:none}.form{padding:34px 24px}}</style></head><body>
<main class="wrap"><section class="visual"><a href="https://mawaseel.ps"><img src="https://i.ibb.co/678mybGy/image.png" alt="مواصيل"></a><h2>إدارة الطلبات.<br><span>للفريق فقط.</span></h2><small>MAWASEEL ADMIN PORTAL</small></section><section class="form"><div class="eyebrow">بوابة الإدارة</div><h1>فوت ع حسابك.</h1><p>استخدم اسم المستخدم وكلمة السر اللي أعطاك إياهم الحساب الأساسي.</p><form id="form"><label>اسم المستخدم</label><input id="username" type="text" required autocomplete="username" spellcheck="false" placeholder="اسم مستخدم الإدارة"><label>كلمة السر</label><input id="password" type="password" required autocomplete="current-password"><button id="submit" type="submit">دخول الإدارة <i class="fa-solid fa-arrow-left"></i></button><div class="msg" id="msg"></div></form><a class="back" href="https://mawaseel.ps"><i class="fa-solid fa-arrow-right"></i> ارجع للموقع</a></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';import {getAuth,setPersistence,browserLocalPersistence,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBC4KevTkZ_myJZ5kG7LXqAALUVSdLsnHE',authDomain:'mawaseel.firebaseapp.com',projectId:'mawaseel',storageBucket:'mawaseel.firebasestorage.app',messagingSenderId:'877553024815',appId:'1:877553024815:web:bdd1a3c4b352e915e06bda',measurementId:'G-7X5GBYVJ9M'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const PRIMARY_ADMIN_USERNAME='mw_gL3tVL71En6C';const PRIMARY_ADMIN_EMAIL='mw.gl3tvl71en6c@mawaseel.ps';const msg=document.getElementById('msg'),btn=document.getElementById('submit');
function cookie(role){document.cookie=`mawaseel_portal=${role}; Domain=.mawaseel.ps; Path=/; Max-Age=2592000; SameSite=Lax; Secure`;}function usernameToEmail(raw){const u=String(raw||'').trim();if(u.toLowerCase()===PRIMARY_ADMIN_USERNAME.toLowerCase())return PRIMARY_ADMIN_EMAIL;const n=u.toLowerCase();if(!/^[a-z0-9._-]{4,32}$/.test(n))throw new Error('invalid-admin-login');return `${n}@admin.mawaseel.ps`}
async function route(user){const s=await getDoc(doc(db,'users',user.uid));const d=s.exists()?s.data():{};if((d.role==='admin'||d.isAdmin===true)&&d.active!==false){cookie('admin');location.replace('./');return true}await signOut(auth);msg.textContent=d.active===false?'حساب الإدارة هذا معطّل.':'هذا الحساب مش حساب إدارة.';return false}
await setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,u=>{if(u)route(u).catch(()=>{})});document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> جاري الدخول';try{const email=usernameToEmail(document.getElementById('username').value);const passwordValue=document.getElementById('password').value;const c=await signInWithEmailAndPassword(auth,email,passwordValue);await route(c.user)}catch(err){console.error(err);if(err.message==='invalid-admin-login')msg.textContent='صيغة اسم المستخدم مش صحيحة.';else if(['auth/invalid-credential','auth/user-not-found','auth/wrong-password'].includes(err.code))msg.textContent='اسم المستخدم أو كلمة السر غلط.';else if(err.code==='auth/network-request-failed')msg.textContent='تعذر الاتصال بـ Firebase.';else msg.textContent='صار خطأ أثناء تسجيل الدخول.'}finally{btn.disabled=false;btn.innerHTML='دخول الإدارة <i class="fa-solid fa-arrow-left"></i>'}});
</script></body></html>
